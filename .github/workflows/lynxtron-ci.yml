name: Lynxtron CI

# CI for the Lynx client on the fork. Separate from ci.yml: it must run without
# upstream's Blacksmith runners, and it covers apps/lynxtron only.
#
# Runs on macOS because Lynxtron and its CEF runtime ship macOS binaries only;
# the build and several script tests cannot run on Linux.

on:
  push:
    branches: [lynxtron-port]
  pull_request:
    branches: [lynxtron-port]

concurrency:
  group: lynxtron-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lynxtron typecheck / test / build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install
        run: |
          corepack enable && corepack prepare --activate
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @t3tools/lynxtron run typecheck

      - name: Test
        run: pnpm --filter @t3tools/lynxtron run test

      - name: Audits (Web API + CSS compatibility)
        run: pnpm --filter @t3tools/lynxtron run audit

      - name: Build (server bundle and Lynx app)
        run: pnpm --filter t3 build:bundle && pnpm build:lynxtron
