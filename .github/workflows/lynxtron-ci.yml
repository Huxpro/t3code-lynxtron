name: Lynxtron CI

# CI for the Lynx client on the fork. Separate from ci.yml: it must run without
# upstream's Blacksmith runners, and it covers apps/lynxtron only.
#
# Runs on macOS because Lynxtron and its CEF runtime ship macOS binaries only;
# several script tests cannot run on Linux. The Lynx app build is not run here
# yet; build it locally with `pnpm build:lynxtron`.

on:
  push:
    branches: [lynxtron-port]
  pull_request:
    branches: [lynxtron-port]

concurrency:
  group: lynxtron-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lynxtron typecheck / test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Some script tests and the upstream delta check read git history.
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install
        run: |
          corepack enable && corepack prepare --activate
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @t3tools/lynxtron run typecheck

      - name: Build the server bundle (fixture tests launch it)
        run: pnpm --filter t3 build:bundle

      - name: Test
        run: pnpm --filter @t3tools/lynxtron run test

      - name: Audits (Web API + CSS compatibility)
        run: pnpm --filter @t3tools/lynxtron run audit
